# Configuration for dump1090-web.service.
# Change server.bind to a LAN address to allow access from another machine.
server.bind = "127.0.0.1"
server.port = 8080

server.modules = ( "mod_indexfile", "mod_alias", "mod_staticfile" )
server.document-root = "/usr/share/dump1090/html"
index-file.names = ( "index.html" )

alias.url = ( "/data/" => "/run/dump1090/" )

mimetype.assign = (
    ".html" => "text/html; charset=utf-8",
    ".css" => "text/css; charset=utf-8",
    ".js" => "text/javascript; charset=utf-8",
    ".json" => "application/json",
    ".geojson" => "application/geo+json",
    ".png" => "image/png",
    ".gif" => "image/gif",
    ".svg" => "image/svg+xml",
    ".ico" => "image/x-icon",
    ".woff" => "font/woff",
    ".woff2" => "font/woff2"
)
