[Unit]
# Fall back to SDDM.
OnFailure=sddm.service

[Service]
# Clear the ExecStart= line in plasmalogin.service and replace with what
# is defined in this drop-in configuration.
ExecStart=
# Generated to be either...
#
#   1. A symlink to /usr/bin/plasmalogin, when not on LoongGPU.
#   2. A generated script (see /usr/libexec/loonggl-hack), when on
#      LoongGPU, the script prints out an error regarding broken
#      plasma-login-manager when running on LoongGPU, then exits with
#      error code 1.
ExecStart=/run/plasmalogin.loonggl
