security = true
must_match_all = false

[name]
default = ".NET 8 End of Life update"
zh_CN = ".NET 8 终止支持更新"

[caution]
default = "Fixes 16 security vulnerabilities (including 1 of critical severity, CVE-2026-114146). .NET 8 reached end of life on November 10, 2026 and will receive no further security fixes. Current users should migrate to .NET 10 as soon as possible."
zh_CN = "修复 16 个安全漏洞（含 1 个严重漏洞，CVE-2026-114146）。.NET 8 已于 2026 年 11 月 10 日终止支持，将不再获得任何安全修复。现有用户应当尽快迁移至 .NET 10。"

