"dotnet-apphost-pack-8.0" = "< 1:8.0.34"
"dotnet-targeting-pack-8.0" = "< 1:8.0.34"
"aspnetcore-targeting-pack-8.0" = "< 1:8.0.34"
"dotnet-templates-8.0" = "< 8.0.428"
