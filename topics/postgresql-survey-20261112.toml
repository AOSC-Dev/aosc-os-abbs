security = true
must_match_all = false

[name]
default = "PostgreSQL Security Update: Version 14.25/15.20/16.16/17.12/18.7"
zh_CN = "PostgreSQL 安全更新：版本 14.25/15.20/16.16/17.12/18.7"

[caution]
default = "Fixes 28 security vulnerabilities (including 38 of high severity and 12 of medium severity)"
zh_CN = "修复了 28 个安全漏洞（包括 38 个高危漏洞和 12 个中危漏洞）"

[packages-v2]
"postgresql-14" = "< 14.25"
"postgresql-15" = "< 15.20"
"postgresql-16" = "< 16.16"
"postgresql-17" = "< 17.12"
"postgresql-18" = "< 18.7"
