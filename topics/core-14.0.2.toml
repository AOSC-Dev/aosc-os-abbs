security = true
must_match_all = false

[name]
default = "AOSC OS Core 14.0.2"
zh_CN = "安同 OS 核心包，版本 14.0.2"

[caution]
default = "Fixes a double free after allocation failure in regcomp and regexec functions (CVE-2026-100290, Severity: Low) and an one-byte buffer overwrite in *wscanf functions (CVE-2026-115819, Severity: Medium) for glibc"
zh_CN = "修复 glibc 中 regcomp 和 regexec 函数在处理内存分配失败时出现的一个重复释放 (double free) 漏洞（编号 CVE-2026-100290，严重性：低）和 *wscanf 函数中的一个单字节缓冲区越界写入漏洞（编号 CVE-2026-115819，严重性：中）"

[packages-v2]
"aosc-aaa" = "< 14.0.2"
"glibc" = "< 1:2.44-2"
