security = false
must_match_all = false

[name]
default = "KDE Plasma 6 Desktop Environment Update"
zh_CN = "KDE Plasma 6 桌面环境更新"

[caution]
default = """
Updates the KDE Plasma Desktop Environment to version 6.7, with updated applications and configuration defaults.

Before you proceed, please read our notes for this update:

https://aosc.io/news/2026-10-11-kde-6.7-update-notes
"""
zh_CN = """
更新 KDE Plasma 桌面环境到版本 6.7，包含应用程序及默认配置更新。

在更新前，请阅读更新须知：

https://aosc.io/news/2026-10-11-kde-6.7-update-notes
"""

[packages-v2]
"kde-base" = "< 24"
"plasma-distro-base" = "< 13"
"plasma-default-settings" = "< 2026.10.0"
