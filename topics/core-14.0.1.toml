security = true
must_match_all = false

[name]
default = "AOSC OS Core 14.0.1"
zh_CN = "安同 OS 核心包，版本 14.0.1"

[caution]
default = "Fixes a Path Traversal vulnerability in glibc (CVE-2026-84243, Severity: High) and mitigates leaked sensitive information in installation log from system installer (DeployKit) versions < 0.10.3 - GHSA-283w-2mpw-xqfx (CVE pending, Severity: High)"
zh_CN = "修复 glibc 中的 1 个路径遍历 (Path Traversal) 漏洞（漏洞编号 CVE-2026-84243，严重性：高）并缓解版本 < 0.10.3 的系统安装程序 (DeployKit) 在安装日志中残留敏感信息的问题，漏洞编号 GHSA-283w-2mpw-xqfx（CVE 编号待定，严重性：高）"

[packages-v2]
"aosc-aaa" = "< 14.0.1"
"glibc" = "< 1:2.44-1"
