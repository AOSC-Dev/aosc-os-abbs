security = false

[name]
default = "acme.sh 3.1.6"

[caution]
default = """
This update introduces the following changes:

1. Since 3.1.4, ACME Renewal Information (ARI) is now enabled by default and the renewal interval has been adjusted to 6 hours.
2. The `--upgrade' parameter will now defer to the system package manager for upgrades.
3. Standalone mode now listens on both IPv4 and IPv6 by default.
"""

zh_CN = """
本次更新引入以下变更：

1. 自 3.1.4 起，现在默认开启 ACME 续签信息 (ARI) 功能并每 6 小时执行一次续签；
2. `--upgrade' 参数现在将发起系统包管理更新；
3. Standalone 模式现在默认同时监听 IPv4 和 IPv6。
"""

[packages-v2]
"acme.sh" = "< 3.1.6"
